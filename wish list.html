<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=wishlist.html">

    <title>Wishlist | PRIYA Stylekart</title>

    <link rel="stylesheet" href="wishlist.css">
    <link rel="stylesheet" href="site-theme.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>PRIYA Fancy Store</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="product.html">Products</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="wishlist.html" class="active">
                <i class="fa-solid fa-heart"></i> Wishlist
            </a>
            <a href="cart.html">
                <i class="fa-solid fa-cart-shopping"></i> Cart
            </a>
        </nav>

    </header>


    <!-- WISHLIST HEADING -->

    <section class="heading">

        <h2>❤️</h2>

        <p>Your favourite products are saved here.</p>

    </section>


    <!-- WISHLIST PRODUCTS -->

    <section class="wishlist">

        <div class="wishlist-card">

            <img
                src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600"
                alt="Hand Bag">

            <div class="wishlist-info">

                <h3>Luxury Hand Bag</h3>

                <p class="price">₹999</p>

                <p class="rating">★★★★★</p>

                <div class="buttons">

                    <button class="cart-btn">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Add to Cart
                    </button>

                    <button class="remove-btn">
                        <i class="fa-solid fa-trash"></i>
                        Remove
                    </button>

                </div>

            </div>

        </div>


        <div class="wishlist-card">

            <img
                src="https://images.unsplash.com/photo-1617038220319-276d3cfab638?w=600"
                alt="Gold Necklace">

            <div class="wishlist-info">

                <h3>Gold Necklace</h3>

                <p class="price">₹2,299</p>

                <p class="rating">★★★★★</p>

                <div class="buttons">

                    <button class="cart-btn">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Add to Cart
                    </button>

                    <button class="remove-btn">
                        <i class="fa-solid fa-trash"></i>
                        Remove
                    </button>

                </div>

            </div>

        </div>


        <div class="wishlist-card">

            <img
                src="https://images.unsplash.com/photo-1523170335258-f5ed11844a49?w=600"
                alt="Ladies Watch">

            <div class="wishlist-info">

                <h3>Ladies Watch</h3>

                <p class="price">₹1,499</p>

                <p class="rating">★★★★★</p>

                <div class="buttons">

                    <button class="cart-btn">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Add to Cart
                    </button>

                    <button class="remove-btn">
                        <i class="fa-solid fa-trash"></i>
                        Remove
                    </button>

                </div>

            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <h3>PRIYA Fancy Store</h3>

        <p>Style • Quality • Affordability</p>

        <p>© 2026 PRIYA Fancy Store. All Rights Reserved.</p>

    </footer>

</body>

</html>
